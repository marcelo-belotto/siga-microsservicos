services:

  postgres:
    image: postgres:16-alpine
    container_name: siga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - siga-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - siga-network

  api-gateway:
    build:
      context: ./api-gateway
    container_name: siga-api-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/gatewaydb
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1800000}
      ACADEMICO_SERVICE_URL: http://academico-service:8083
      ALUNO_SERVICE_URL: http://aluno-service:8081
      MATRICULA_SERVICE_URL: http://matricula-service:8082
      AVALIACAO_SERVICE_URL: http://avaliacao-service:8084
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
    ports:
      - "8080:8080"
    networks:
      - siga-network

  aluno-service:
    build:
      context: ./aluno-service
    container_name: siga-aluno-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/alunodb
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1800000}
      GATEWAY_URL: http://api-gateway:8080
    #ports:
      # Em produção, remover este bloco — apenas o api-gateway (8080) deve ser exposto.
      # Descomente abaixo somente em desenvolvimento local para acesso direto.
      #- "8081:8081"
    networks:
      - siga-network

  matricula-service:
    build:
      context: ./matricula-service
    container_name: siga-matricula-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/matriculadb
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1800000}
      GATEWAY_URL: http://api-gateway:8080
    #ports:
      # Em produção, remover este bloco — apenas o api-gateway (8080) deve ser exposto.
      # Descomente abaixo somente em desenvolvimento local para acesso direto.
      #- "8082:8082"
    networks:
      - siga-network

  academico-service:
    build:
      context: ./academico-service
    container_name: siga-academico-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/academicodb
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1800000}
      GATEWAY_URL: http://api-gateway:8080
    #ports:
      # Em produção, remover este bloco — apenas o api-gateway (8080) deve ser exposto.
      # Descomente abaixo somente em desenvolvimento local para acesso direto.
      #- "8083:8083"
    networks:
      - siga-network

  avaliacao-service:
    build:
      context: ./avaliacao-service
    container_name: siga-avaliacao-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/avaliacaodb
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1800000}
      GATEWAY_URL: http://api-gateway:8080
    #ports:
      # Em produção, remover este bloco — apenas o api-gateway (8080) deve ser exposto.
      # Descomente abaixo somente em desenvolvimento local para acesso direto.
      #- "8084:8084"
    networks:
      - siga-network

networks:
  siga-network:
    driver: bridge

volumes:
  siga-postgres-data:
