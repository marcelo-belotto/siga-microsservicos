server.port=8081
spring.application.name=aluno-service
spring.config.import=optional:file:.env[.properties]

# PostgreSQL — credenciais
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/alunodb}
spring.datasource.username=${DB_USERNAME:siga}
spring.datasource.password=${DB_PASSWORD:siga}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:minhasenhasecretamuitoextensaparaassinarojwt2024!}
jwt.expiration=${JWT_EXPIRATION:1800000}

# URL do API Gateway (base para chamadas inter-serviço)
gateway.url=${GATEWAY_URL:http://localhost:8080}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
