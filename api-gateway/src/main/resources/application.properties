server.port=8080
spring.application.name=api-gateway
spring.config.import=optional:file:.env[.properties]

# PostgreSQL exclusivo do api-gateway (dominio de autenticacao/usuario)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gatewaydb}
spring.datasource.username=${DB_USERNAME:siga}
spring.datasource.password=${DB_PASSWORD:siga}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Popula o usuario admin padrao no boot (idempotente via WHERE NOT EXISTS)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT - segredo compartilhado com os demais servicos (mesmo valor em todos)
jwt.secret=${JWT_SECRET:minhasenhasecretamuitoextensaparaassinarojwt2024!}
jwt.expiration=${JWT_EXPIRATION:1800000}

# === Enderecos dos microsservicos downstream ===
services.academico.url=${ACADEMICO_SERVICE_URL:http://localhost:8083}
services.aluno.url=${ALUNO_SERVICE_URL:http://localhost:8081}
services.matricula.url=${MATRICULA_SERVICE_URL:http://localhost:8082}
services.avaliacao.url=${AVALIACAO_SERVICE_URL:http://localhost:8084}

# Actuator
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=when-authorized

# CORS liberado para o front local
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080}
